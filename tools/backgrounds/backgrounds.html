<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Segan Sessions backgrounds</title>
<style>
  body { margin: 0; background: #0b0c10; color: #e8eaf0; font: 13px/1.4 system-ui, sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; padding: 12px; }
  figure { margin: 0; }
  canvas { width: 100%; height: auto; display: block; border-radius: 10px; }
  figcaption { padding: 6px 2px; color: #a6abb9; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script>
// Every Screener backdrop is drawn here from code with a fixed seed, so a re-render is identical
// and the art is original — no stock photos, no licences to track. Open this file in Chrome to
// preview; tools/backgrounds/render.mjs writes the shipped files into public/backgrounds/.
'use strict';
const TAU = Math.PI * 2;
const lerp = (a, b, t) => a + (b - a) * t;

// mulberry32 — tiny seeded PRNG
function rng(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rgb(hex) { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgba(hex, a) { const [r, g, b] = rgb(hex); return `rgba(${r},${g},${b},${a})`; }

function canvas(w, h = w) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function fillGradient(ctx, g, stops) { stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c)); return g; }

// Soft colour fields: blobs drawn on a quarter-size canvas through a big blur, then scaled up.
// Blurred art has no fine detail, so the upscale is lossless to the eye and 16× cheaper.
function softField(S, base, blobs, blurFrac = 0.1) {
  const s = Math.round(S / 4);
  const c = canvas(s), x = c.getContext('2d');
  if (base) { x.fillStyle = base; x.fillRect(0, 0, s, s); }
  x.filter = `blur(${Math.round(s * blurFrac)}px)`;
  for (const b of blobs) {
    x.globalAlpha = b.a ?? 1;
    x.globalCompositeOperation = b.op || 'source-over';
    x.fillStyle = b.c;
    x.beginPath();
    x.ellipse(b.x * s, b.y * s, b.rx * s, (b.ry ?? b.rx) * s, b.rot ?? 0, 0, TAU);
    x.fill();
  }
  return c;
}
function drawUp(ctx, S, src) {
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(src, 0, 0, S, S);
}

function vignette(ctx, S, strength, color = '#000000', inner = 0.28) {
  const g = ctx.createRadialGradient(S / 2, S / 2, S * inner, S / 2, S / 2, S * 0.74);
  g.addColorStop(0, rgba(color, 0)); g.addColorStop(1, rgba(color, strength));
  ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
}

// Fine monochrome grain. Also dithers away gradient banding once the image is 8-bit.
function grain(ctx, S, amount, seed) {
  const img = ctx.getImageData(0, 0, S, S), d = img.data, r = rng(seed);
  for (let i = 0; i < d.length; i += 4) {
    const n = (r() - 0.5) * amount;
    d[i] += n; d[i + 1] += n; d[i + 2] += n;
  }
  ctx.putImageData(img, 0, 0);
}

// Layered ridges receding into haze. Layers alternate the way they fall, so the frame reads as a
// valley; nearer layers sit lower, darker and sharper.
function dunes(ctx, S, seed, P) {
  const r = rng(seed);
  ctx.fillStyle = fillGradient(ctx, ctx.createLinearGradient(0, 0, 0, S), P.sky);
  ctx.fillRect(0, 0, S, S);
  const glow = ctx.createRadialGradient(S * P.sun[0], S * P.sun[1], 0, S * P.sun[0], S * P.sun[1], S * 0.75);
  glow.addColorStop(0, rgba(P.glow, 0.9)); glow.addColorStop(1, rgba(P.glow, 0));
  ctx.fillStyle = glow; ctx.fillRect(0, 0, S, S);

  const n = P.layers.length;
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);                                    // 0 = farthest, 1 = nearest
    const side = i % 2 ? -1 : 1;
    const base = lerp(P.top ?? 0.3, P.bottom ?? 0.94, Math.pow(t, 0.85)) * S;
    // one long diagonal sweep per ridge (a sigmoid), rising to the right or to the left
    const rise = S * lerp(0.07, 0.15, r()) * lerp(1.15, 0.8, t);
    const width = S * lerp(0.1, 0.2, r());
    const pivot = S * lerp(0.3, 0.7, r());
    const waves = [0, 1].map((k) => ({
      a: (S * lerp(0.006, 0.014, r())) / (k + 1), f: (k + 1) * lerp(0.4, 0.9, r()), p: r() * TAU,
    }));
    const y = (x) => {
      const s = 1 / (1 + Math.exp((-side * (x - pivot)) / width));
      return base - rise * (s - 0.5) * 2 + waves.reduce((sum, w) => sum + w.a * Math.sin((TAU * w.f * x) / S + w.p), 0);
    };
    const path = new Path2D(), crestLine = new Path2D();
    path.moveTo(-S * 0.1, S * 1.2);
    for (let x = -S * 0.1; x <= S * 1.1; x += S / 300) {
      path.lineTo(x, y(x));
      x <= -S * 0.1 ? crestLine.moveTo(x, y(x)) : crestLine.lineTo(x, y(x));
    }
    path.lineTo(S * 1.1, S * 1.2); path.closePath();

    let crest = Infinity;
    for (let x = 0; x <= S; x += S / 60) crest = Math.min(crest, y(x));
    const fill = ctx.createLinearGradient(0, crest, 0, crest + S * 0.5);
    fill.addColorStop(0, P.layers[i][0]); fill.addColorStop(1, P.layers[i][1]);
    ctx.save();
    ctx.filter = `blur(${Math.max(0, Math.round(S * 0.007 * (1 - t) ** 1.4))}px)`;
    ctx.fillStyle = fill; ctx.fill(path);
    ctx.restore();

    // light catching the crest: a soft glow just inside the ridge line
    ctx.save();
    ctx.clip(path);
    ctx.filter = `blur(${Math.round(S * 0.008)}px)`;
    ctx.strokeStyle = rgba(P.rim ?? P.glow, (P.rimA ?? 0.22) * lerp(1, 0.45, t));
    ctx.lineWidth = S * 0.018;
    ctx.stroke(crestLine);
    ctx.restore();

    // a veil of haze over everything drawn so far — farther layers end up under more of it
    if (i < n - 1) {
      const veil = ctx.createLinearGradient(0, base - S * 0.3, 0, base + S * 0.25);
      veil.addColorStop(0, rgba(P.haze, 0)); veil.addColorStop(1, rgba(P.haze, (P.hazeA ?? 0.22) * (1 - t)));
      ctx.fillStyle = veil; ctx.fillRect(0, 0, S, S);
    }
  }
}

function aurora(ctx, S, seed, P) {
  const r = rng(seed);
  ctx.fillStyle = fillGradient(ctx, ctx.createLinearGradient(0, 0, 0, S), P.base);
  ctx.fillRect(0, 0, S, S);
  const s = Math.round(S / 4), c = canvas(s), x = c.getContext('2d');
  x.globalCompositeOperation = 'lighter';
  for (const rib of P.ribbons) {
    x.filter = `blur(${Math.round(s * rib.blur)}px)`;
    x.strokeStyle = rgba(rib.c, rib.a); x.lineWidth = s * rib.w; x.lineCap = 'round';
    x.beginPath();
    const y0 = rib.y * s, amp = s * rib.amp, ph = r() * TAU;
    for (let i = 0; i <= 80; i++) {
      const px = lerp(-0.1, 1.1, i / 80) * s;
      const py = y0 + Math.sin(i / 80 * TAU * rib.f + ph) * amp + (px - s / 2) * rib.tilt;
      i ? x.lineTo(px, py) : x.moveTo(px, py);
    }
    x.stroke();
  }
  drawUp(ctx, S, c);
}

function gridGlow(ctx, S, seed, P) {
  drawUp(ctx, S, softField(S, P.base, P.blobs, 0.12));
  const dots = canvas(S), d = dots.getContext('2d'), step = S / P.cells, rad = S * 0.0011;
  d.fillStyle = rgba(P.dot, P.dotA);
  for (let yy = step / 2; yy < S; yy += step) {
    for (let xx = step / 2; xx < S; xx += step) { d.beginPath(); d.arc(xx, yy, rad, 0, TAU); d.fill(); }
  }
  d.globalCompositeOperation = 'destination-in';            // fade the grid out towards the edges
  const m = d.createRadialGradient(S * 0.55, S * 0.45, S * 0.05, S * 0.55, S * 0.45, S * 0.72);
  m.addColorStop(0, 'rgba(0,0,0,1)'); m.addColorStop(1, 'rgba(0,0,0,0)');
  d.fillStyle = m; d.fillRect(0, 0, S, S);
  ctx.drawImage(dots, 0, 0);
}

function seamless(ctx, S, seed, P) {
  // a photo-studio paper sweep: lit centre, falloff to the corners, a soft floor line
  const g = ctx.createRadialGradient(S * 0.5, S * 0.42, S * 0.02, S * 0.5, S * 0.5, S * 0.78);
  fillGradient(ctx, g, P.stops); ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
  const floor = ctx.createLinearGradient(0, S * 0.62, 0, S);
  floor.addColorStop(0, rgba(P.floor, 0)); floor.addColorStop(0.35, rgba(P.floor, P.floorA)); floor.addColorStop(1, rgba(P.floor, 0));
  ctx.fillStyle = floor; ctx.fillRect(0, 0, S, S);
}

const BACKGROUNDS = [
  { id: 'segan-dunes', name: 'Segan Dunes', grain: 5, draw: (c, S) => dunes(c, S, 11, {
      sky: ['#c9dbff', '#8db0ff', '#5b86f5'], glow: '#eef4ff', sun: [0.56, 0.12], haze: '#a9c3ff', hazeA: 0.26,
      layers: [['#7ea2ff', '#5b80f2'], ['#6a8ef9', '#4566e6'], ['#5277f2', '#2f4fd6'], ['#3d5fe0', '#2238b3'],
               ['#2a44c4', '#16248a'], ['#1b2d93', '#0d1658'], ['#111c5e', '#070b2c'], ['#0a0f36', '#04050f']],
    }) },
  { id: 'midnight', name: 'Midnight', grain: 7, draw: (c, S) => {
      drawUp(c, S, softField(S, '#07070b', [
        { x: 0.52, y: -0.06, rx: 0.62, ry: 0.42, c: '#246cf8', a: 0.62 },
        { x: 0.12, y: 1.04, rx: 0.5, ry: 0.32, c: '#3f38e0', a: 0.32 },
        { x: 0.95, y: 0.7, rx: 0.3, c: '#1a52cc', a: 0.18 },
      ], 0.14));
      vignette(c, S, 0.55);
    } },
  { id: 'aurora', name: 'Aurora', grain: 7, draw: (c, S) => { aurora(c, S, 23, {
      base: ['#03050d', '#060a1c', '#04060f'],
      ribbons: [
        { y: 0.34, amp: 0.07, f: 1.1, tilt: -0.18, w: 0.16, blur: 0.07, c: '#38d6f0', a: 0.55 },
        { y: 0.44, amp: 0.09, f: 0.8, tilt: -0.1, w: 0.2, blur: 0.09, c: '#246cf8', a: 0.6 },
        { y: 0.56, amp: 0.06, f: 1.3, tilt: -0.22, w: 0.14, blur: 0.08, c: '#8a5cfc', a: 0.5 },
        { y: 0.3, amp: 0.05, f: 1.6, tilt: -0.15, w: 0.05, blur: 0.025, c: '#9cf3ff', a: 0.35 },
      ] }); vignette(c, S, 0.5); } },
  { id: 'violet-mesh', name: 'Violet Mesh', grain: 7, draw: (c, S) => {
      drawUp(c, S, softField(S, '#0c0a24', [
        { x: 0.2, y: 0.2, rx: 0.45, c: '#3f38e0', a: 0.9 },
        { x: 0.85, y: 0.3, rx: 0.4, c: '#8a5cfc', a: 0.85 },
        { x: 0.55, y: 0.85, rx: 0.5, c: '#246cf8', a: 0.75 },
        { x: 0.95, y: 0.95, rx: 0.3, c: '#d65ce0', a: 0.45 },
        { x: 0.1, y: 0.95, rx: 0.3, c: '#0a0820', a: 0.9 },
      ], 0.12));
      vignette(c, S, 0.35);
    } },
  { id: 'ember-dunes', name: 'Ember Dunes', grain: 5, draw: (c, S) => dunes(c, S, 7, {
      sky: ['#ffe2bf', '#ffb27a', '#f07a52'], glow: '#fff3e2', sun: [0.42, 0.14], haze: '#ffc79a', hazeA: 0.24,
      layers: [['#f79a68', '#e57552'], ['#e9805a', '#cc5a45'], ['#d4664e', '#ab4038'], ['#b54a40', '#86302f'],
               ['#8e3434', '#5e2026'], ['#63212a', '#3b111a'], ['#3e1219', '#1f080d'], ['#22090e', '#0d0306']],
    }) },
  { id: 'ocean-dunes', name: 'Ocean Dunes', grain: 5, draw: (c, S) => dunes(c, S, 31, {
      sky: ['#d3fbff', '#8fe3ef', '#4fbfd3'], glow: '#f2feff', sun: [0.5, 0.1], haze: '#a7ecf3', hazeA: 0.25,
      layers: [['#6fd0de', '#4fb4c8'], ['#52b6c9', '#3796ad'], ['#3b9bb2', '#237893'], ['#26809a', '#165e78'],
               ['#18657e', '#0d4559'], ['#0f4b5e', '#082f3d'], ['#093340', '#041b24'], ['#051e26', '#020b0f']],
    }) },
  { id: 'graphite', name: 'Graphite', grain: 8, draw: (c, S) => {
      const g = c.createRadialGradient(S * 0.5, S * 0.4, S * 0.04, S * 0.5, S * 0.5, S * 0.8);
      fillGradient(c, g, ['#2b2f39', '#171a21', '#08090c']); c.fillStyle = g; c.fillRect(0, 0, S, S);
    } },
  { id: 'blueprint', name: 'Blueprint', grain: 6, draw: (c, S) => { gridGlow(c, S, 5, {
      base: '#050a1a', cells: 40, dot: '#7fa6ff', dotA: 0.32,
      blobs: [{ x: 0.85, y: 0.85, rx: 0.5, c: '#246cf8', a: 0.5 }, { x: 0.1, y: 0.05, rx: 0.4, c: '#3f38e0', a: 0.3 }],
    }); vignette(c, S, 0.45); } },
  { id: 'studio-grey', name: 'Studio Grey', grain: 6, draw: (c, S) => { seamless(c, S, 3, {
      stops: ['#eceef2', '#d3d7de', '#a8aeb8', '#7d838e'], floor: '#ffffff', floorA: 0.12,
    }); } },
  { id: 'paper', name: 'Paper', grain: 6, draw: (c, S) => {
      const g = c.createRadialGradient(S * 0.5, S * 0.42, S * 0.05, S * 0.5, S * 0.5, S * 0.8);
      fillGradient(c, g, ['#fffdf8', '#f5f0e6', '#e6dfd1']); c.fillStyle = g; c.fillRect(0, 0, S, S);
    } },
  { id: 'mint', name: 'Mint', grain: 5, draw: (c, S) => {
      drawUp(c, S, softField(S, '#eafaf6', [
        { x: 0.15, y: 0.2, rx: 0.45, c: '#bff2e2', a: 0.95 },
        { x: 0.85, y: 0.25, rx: 0.4, c: '#bfe9fb', a: 0.9 },
        { x: 0.6, y: 0.9, rx: 0.5, c: '#a6efe0', a: 0.8 },
        { x: 0.5, y: 0.5, rx: 0.25, c: '#ffffff', a: 0.7 },
      ], 0.12));
    } },
  { id: 'sunrise', name: 'Sunrise', grain: 5, draw: (c, S) => {
      drawUp(c, S, softField(S, '#ffe9dc', [
        { x: 0.1, y: 0.1, rx: 0.5, c: '#ffd2a8', a: 0.95 },
        { x: 0.9, y: 0.35, rx: 0.45, c: '#ffb6c8', a: 0.85 },
        { x: 0.4, y: 0.95, rx: 0.55, c: '#c8b8ff', a: 0.85 },
        { x: 0.55, y: 0.45, rx: 0.2, c: '#fff6ee', a: 0.8 },
      ], 0.12));
    } },
];

// Render one backdrop at `size` px square (plus a thumbnail) and return both as WebP data URLs.
async function renderOne(id, size, thumbSize, quality = 0.9) {
  const bg = BACKGROUNDS.find((b) => b.id === id);
  const c = canvas(size), ctx = c.getContext('2d', { willReadFrequently: true });
  bg.draw(ctx, size);
  if (bg.grain) grain(ctx, size, bg.grain, 1234);
  const t = canvas(thumbSize), tx = t.getContext('2d');
  tx.imageSmoothingQuality = 'high';
  tx.drawImage(c, 0, 0, thumbSize, thumbSize);
  return { full: c.toDataURL('image/webp', quality), thumb: t.toDataURL('image/webp', 0.85) };
}
window.BACKGROUNDS = BACKGROUNDS.map(({ id, name }) => ({ id, name }));
window.renderOne = renderOne;

// Opened directly: a preview grid.
if (!navigator.webdriver || location.search.includes('preview')) {
  const grid = document.getElementById('grid');
  for (const bg of BACKGROUNDS) {
    const c = canvas(720), ctx = c.getContext('2d', { willReadFrequently: true });
    bg.draw(ctx, 720);
    if (bg.grain) grain(ctx, 720, bg.grain, 1234);
    const f = document.createElement('figure');
    f.append(c, Object.assign(document.createElement('figcaption'), { textContent: `${bg.name} · ${bg.id}` }));
    grid.append(f);
  }
}
</script>
</body>
</html>
